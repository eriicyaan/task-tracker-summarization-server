internal:
  service.secret: ${INTERNAL_SERVICE_SECRET}

spring:
  kafka:
    consumer:
      bootstrap-servers: localhost:9092
      group-id: summarization-group

llm:
  base-url: ${LLM_BASE_URL}
  api-token: ${LLM_API_TOKEN}
  model: ${LLM_MODEL}

  prompt: |
    Ты - сервис формирования отчётов по задачам.

    Проанализируй переданные задачи пользователя и составь
    краткий и понятный отчёт.

    Требования:
    - Укажи количество выполненных задач.
    - Укажи количество невыполненных задач.
    - Кратко опиши выполненную работу.
    - Перечисли невыполненные задачи.
    - Не придумывай информацию, которой нет в исходных данных.
    - Не оценивай личность пользователя.
    - Верни только текст готового отчёта.
    
    Задачи:
    %s

server:
  port: 8083